appId: com.triplemanager.desktop
productName: Triple Manager
# `better-sqlite3` v13 trae binarios N-API (`prebuilds/win32-x64.node`), estables
# entre versiones de Node y de Electron: no hace falta recompilarlo con node-gyp,
# que además exige tener Visual Studio Build Tools instalado.
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - '!**/.dev-data/**'
extraResources:
  - from: drizzle
    to: drizzle
  - from: resources/seed-data
    to: seed-data
win:
  # Se apunta al PNG de 512 y no a un `.ico`: electron-builder genera el icono
  # multi-resolución a partir de cualquier PNG de 256 o más, así que no hace
  # falta ni el fichero `.ico` ni una dependencia de imágenes para producirlo.
  icon: assets/iconos/icono_512.png
  target:
    - target: nsis
      arch:
        - x64
  # Firma de código. El certificado NO va en el repositorio ni en este fichero:
  # electron-builder lo lee de las variables de entorno CSC_LINK (ruta o base64
  # del .pfx) y CSC_KEY_PASSWORD. Sin ellas compila igual, sin firmar, que es lo
  # que hace `pnpm build:win`; `pnpm release:win` exige firma y falla si falta.
  # Ver docs/DISTRIBUCION.md.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
    # publisherName: tiene que ser el CN exacto del certificado. Se deja sin poner
    # hasta tenerlo: con él puesto, el auto-update rechaza toda actualización
    # que no venga firmada por ese nombre, y un valor inventado las rechazaría
    # todas.
# Publicación: las versiones se suben como releases de GitHub y la aplicación
# instalada busca ahí el `latest.yml`. Construir no publica nada
# (`--publish never` en los scripts); publicar es un paso aparte y deliberado.
publish:
  provider: github
  owner: cmurestudillos
  repo: virtual-basket-manager
  releaseType: release
nsis:
  # Sin espacios, y a propósito: `latest.yml` nombra el instalador con guiones, y
  # GitHub cambia los espacios por puntos al subir un fichero a una release. Con
  # el nombre por defecto («Triple Manager Setup 0.2.0.exe») la aplicación
  # buscaría un fichero que no existe y ninguna actualización se descargaría.
  artifactName: Triple-Manager-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
